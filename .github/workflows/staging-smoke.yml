name: Staging read-only browser smoke
on:
  pull_request:
    paths:
      - staging-smoke/**
      - playwright.staging.config.cjs
      - .github/workflows/staging-smoke.yml
      - package-lock.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wt002-staging-readonly-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test --config playwright.staging.config.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: staging-readonly-browser-evidence
          path: staging-smoke-results/
          if-no-files-found: error
          retention-days: 14
